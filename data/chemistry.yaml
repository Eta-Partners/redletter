# Redletter — chemistry
#
# The days chemistry marks: the discoveries that changed what the field could do,
# and the people who made them.
#
# Every record here is a dated event taken from the Royal Society of Chemistry's
# "On This Day" archive (edu.rsc.org), which states its own date on the page, or
# from the Nobel Foundation's own pages, or from IUPAC. All of those are on
# data/sources-allowlist.yaml, so one agreeing source is enough.
#
# Nothing here has a hand-written status: scripts/verify_days.py derives it, and
# a day whose source does not load or does not state the date does not print.
#
# The file is the output of a research handoff: the lines arrived in the format
# scripts/from_lines.py accepts, were parsed by it, and every surviving record is
# one the gate passed unchanged.
