# Redletter — crewed spaceflight (v1 probe dataset)
#
# Ten days that earned a mark on a crewed-spaceflight calendar. Every entry is a
# record, not a sentence: the date it was recorded in, the date that reaches the
# grid, how sure we are of the day, and the sources that carry it.
#
# `status` and `verification` are not written here — scripts/verify_days.py derives
# them from what the sources actually returned, on the day it ran. Two pages that
# agree but share a publisher count as one source, so a day needs two publishers
# to print.
#
# Rule carried from the design: a day with day-level precision and agreeing
# sources can print; a contested or single-source day stays in the dataset and
# off the calendar.

topic:
  id: crewed-spaceflight
  title: Crewed Spaceflight
  scope: >-
    Human beings leaving Earth and the missions that carried them: firsts,
    programme milestones, dockings and the days the cost was paid. Robotic
    missions, uncrewed tests and launches that failed before crew were aboard
    are out of scope.
  print_year: 2027
  kinds: [launch, first, milestone, loss]

days:
  - id: D-0001
    month_day: "04-12"
    year: 1961
    kind: first
    title: Yuri Gagarin orbits the Earth
    blurb: >-
      Vostok 1, one orbit in 108 minutes. The first human being in space, and
      the first to return from it.
    date:
      as_recorded: 1961-04-12
      calendar: gregorian
      gregorian: 1961-04-12
      precision: day
    sources:
      - type: reference-data
        citation: Vostok 1 — Wikipedia
        url: https://en.wikipedia.org/wiki/Vostok_1
      - type: archive
        citation: NASA history — remembering Yuri Gagarin 50 years later
        url: https://www.nasa.gov/history/remembering-yuri-gagarin-50-years-later/

