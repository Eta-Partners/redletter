# Redletter — chemistry laureates
#
# Built from the Nobel Prize's own API: each record is a laureate of the Nobel
# Prize in Chemistry on the day they were born, with the prize year and the
# citation in the line. The source is nobelprize.org, which is on
# data/sources-allowlist.yaml and so does not need a second publisher.
#
# This is the people calendar, not the field's calendar: for the days chemistry
# marks — discoveries, firsts, the days things were announced — see
# data/chemistry.yaml.
#
# Nothing here has a hand-written status: scripts/verify_days.py derives it.
topic:
  id: chemistry-laureates
  title: Chemistry — Nobel laureates
  scope: Every laureate of the Nobel Prize in Chemistry, on the day they were born, with the prize year
    and citation.
  print_year: 2027
  kinds:
