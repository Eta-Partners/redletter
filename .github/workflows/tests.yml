name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is pinned to 24.04: ubuntu-latest resolves to 26.04, which
        # actions/setup-python has no 3.9 for, and the renderer still promises
        # 3.9. Dropping the leg would change that promise; pinning the runner
        # keeps it tested until 24.04 is retired, when this needs revisiting.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: DejaVu Sans Mono, so the sheet has a font to render with
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        # The network tests are opt-in on purpose: they fail when a publisher moves
        # a page, which says nothing about this code.
        run: pytest -q
